[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfields-torch"
version = "0.1.0"
description = "User-friendly, autograd-enabled torch interface over the fastfields.dlpack bindings."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastfields-dlpack",
    "torch",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

# Ships only the ``fastfields.torch`` subpackage; no ``fastfields/__init__.py``
# is created, keeping ``fastfields`` a PEP 420 native namespace package.
[tool.setuptools.packages.find]
include = ["fastfields.torch*"]
namespaces = true

[tool.ruff]
line-length = 79
extend-exclude = ["docs/examples"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B905",   # zip(strict=...) requires Python >= 3.10
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]
