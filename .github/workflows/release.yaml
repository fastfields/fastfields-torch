# Build & publish the universal (pure-Python) wheel + sdist for this wrapper.
# No compiled code and no CUDA variants: one `py3-none-any` wheel that the wheel
# index lists in every backend folder.
#
# MANUAL ONLY: no push/tag triggers — start it from the Actions tab. Leaving it
# un-triggered is intentional.

name: Release wheels

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit / tag / branch to build"
        type: string
        default: ""
      publish_release:
        description: "Create a GitHub Release and upload the artifacts"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0            # versioningit needs tags/history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build
      - run: python -m build        # sdist + universal wheel into dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ref != '' && inputs.ref || format('wheels-{0}', github.run_id) }}
          files: dist/*
          fail_on_unmatched_files: true
      - name: Ping the wheel index to rebuild
        env:
          GH_TOKEN: ${{ secrets.WHL_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Needs a token with contents:write on fastfields/whl (the default
          # GITHUB_TOKEN is scoped to THIS repo); set WHL_DISPATCH_TOKEN.
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fastfields/whl/dispatches \
            -d '{"event_type":"wheels-updated"}' || \
            echo "::warning::index dispatch failed (set WHL_DISPATCH_TOKEN)"
