# Build & publish this wrapper's universal (pure-Python) wheel + sdist.
#
# Release-driven: publish a GitHub Release here (creating the tag, e.g.
# `0.0.0.dev1`, and writing the notes) and this workflow builds the artifacts
# at that tag, uploads them back onto that same release, and pings
# fastfields/whl to regenerate the wheel index. Nothing to run by hand.
#
# All the logic lives in the org-level reusable workflow so the five package
# repos stay identical; see fastfields/.github for the full contract.

name: Release

on:
  release:
    types: [published]
  # Retry a failed publish against an already-published release, without
  # having to delete and re-cut it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload to"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: fastfields/.github/.github/workflows/python-release.yml@main
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      compiled: false
    secrets: inherit
